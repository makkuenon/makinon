name: Auto Fix + Commit + Xcode Build + IPA Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix_and_build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Auto Fixer Agent
        shell: bash
        run: |
          echo "🔧 Auto-fixer for makinon starting..."

          find . -maxdepth 3 -type f -name "main.swift" -delete

          mkdir -p Core

          cat > Core/IPAFile.swift << 'EOF'
          import Foundation
          public struct IPAFile { public let url: URL }
          EOF

          cat > Core/SigningConfig.swift << 'EOF'
          import Foundation
          public struct SigningConfig {
              public let certificate: String
              public let profile: String
          }
          EOF

          cat > Core/IPASigningService.swift << 'EOF'
          import Foundation
          public final class IPASigningService {
              public init() {}
              public func sign(ipa: IPAFile, config: SigningConfig) {
                  print("Signing \(ipa.url.lastPathComponent) with \(config.certificate)")
              }
          }
          EOF

          cat > Core/CertificateManager.swift << 'EOF'
          import Foundation
          public final class CertificateManager {
              public func load() -> String { "DeveloperCertificate" }
          }
          EOF

          cat > Core/FileHandler.swift << 'EOF'
          import Foundation
          public final class FileHandler {
              public func exists(_ url: URL) -> Bool {
                  FileManager.default.fileExists(atPath: url.path)
              }
          }
          EOF

          mkdir -p App

          cat > App/IPASignerApp.swift << 'EOF'
          import SwiftUI

          @main
          struct IPASignerApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > App/ContentView.swift << 'EOF'
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  Text("Makinon iOS Signer")
                      .padding()
              }
          }
          EOF

          cat > App/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Makinon</string>
              <key>CFBundleIdentifier</key>
              <string>com.makkuenon.makinon</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          EOF

      - name: Commit Fixes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Core App
          git commit -m "Auto-fix: Core/App structure for Xcode + IPA export prep" || echo "No changes"
          git push || echo "Nothing to push"

      - name: Generate Xcode Project with XcodeGen
        shell: bash
        run: |
          echo "📦 Installing XcodeGen..."
          brew install xcodegen
          
          echo "🔨 Generating Xcode project from project.yml..."
          xcodegen generate
          
          echo "✅ Xcode project generated successfully"
          find . -name "*.xcodeproj" -type d

      - name: Build iOS App
        shell: bash
        run: |
          echo "🔨 Building iOS app..."
          xcodebuild \
            -project Makinon.xcodeproj \
            -scheme Makinon \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Makinon.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export IPA
        shell: bash
        run: |
          echo "📦 Exporting IPA..."
          mkdir -p build/output

          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/Makinon.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: makinon-ipa
          path: build/output/*.ipa
