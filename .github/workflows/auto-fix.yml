name: Auto Fix + Commit + Xcode Build + IPA Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix_and_build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Project Structure
        shell: bash
        run: |
          echo "📁 Checking project structure..."
          echo "✓ project.yml exists:" && [ -f project.yml ] && echo "YES" || echo "NO"
          echo "✓ App directory:" && ls -la App/ | head -20
          echo "✓ Checking for storyboards..."
          find App -name "*.storyboard" -type f

      # Import certificates & provisioning profiles (manual signing)
      - name: Import certificates & provisioning profiles
        uses: apple/actions/import-codesign@v1
        with:
          p12-base64: ${{ secrets.APPLE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}
          provisioning-profiles-base64: ${{ secrets.MOBILEPROVISION_BASE64 }}

      - name: Install XcodeGen
        shell: bash
        run: |
          echo "📦 Installing XcodeGen..."
          brew install xcodegen

      - name: Generate Xcode Project
        shell: bash
        run: |
          echo "🔨 Generating Xcode project from project.yml..."
          xcodegen generate

          echo "✅ Xcode project generated"
          ls -la *.xcodeproj || echo "⚠️  No .xcodeproj found"

      - name: List Generated Files
        shell: bash
        run: |
          echo "📋 Generated project structure:"
          find Makinon.xcodeproj -type f | head -20

      - name: Build iOS App
        shell: bash
        run: |
          echo "🔨 Building iOS app..."
          xcodebuild \
            -project Makinon.xcodeproj \
            -scheme Makinon \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Makinon.xcarchive \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SDKROOT=iphoneos \
            archive 2>&1 | tee build.log

      - name: Check Build Result
        shell: bash
        run: |
          if [ -d "build/Makinon.xcarchive" ]; then
            echo "✅ Archive created successfully"
            ls -la build/Makinon.xcarchive
          else
            echo "❌ Archive failed"
            tail -100 build.log
            exit 1
          fi

      - name: Debug: Show installed provisioning profiles
        shell: bash
        run: |
          echo "📋 Installed provisioning profiles (for debug)"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        shell: bash
        run: |
          echo "📦 Exporting IPA..."
          mkdir -p build/output

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                <key>${BUNDLE_ID}</key>
                <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/Makinon.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: makinon-ipa
          path: build/output/*.ipa
          if-no-files-found: warn
