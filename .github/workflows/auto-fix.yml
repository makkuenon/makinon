name: Auto Fix + Commit + Xcode Build + IPA Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix_and_build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Project Structure
        shell: bash
        run: |
          echo "📁 Checking project structure..."
          echo "✓ project.yml exists:" && [ -f project.yml ] && echo "YES" || echo "NO"
          echo "✓ App directory:" && ls -la App/ | head -20
          echo "✓ Checking for storyboards..."
          find App -name "*.storyboard" -type f || true

      - name: Import certificates & provisioning profiles
        uses: apple/actions/import-codesign@v1
        with:
          p12-base64: ${{ secrets.APPLE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}
          provisioning-profiles-base64: ${{ secrets.MOBILEPROVISION_BASE64 }}

      - name: Install XcodeGen
        shell: bash
        run: |
          echo "📦 Installing XcodeGen..."
          brew install xcodegen || true

      - name: Generate Xcode Project
        shell: bash
        run: |
          if [ -f project.yml ]; then
            echo "🔨 Generating Xcode project from project.yml..."
            xcodegen generate || true
            echo "✅ Xcode project generated"
          else
            echo "⚠️ project.yml not found — skipping xcodegen"
          fi
          ls -la *.xcodeproj || true

      - name: Setup Ruby & Fastlane
        shell: bash
        run: |
          echo "💎 Installing Ruby and fastlane..."
          brew install ruby || true
          gem install fastlane -NV || true
          fastlane --version || true

      - name: Build archive with xcodebuild
        shell: bash
        run: |
          echo "🔨 Building archive with xcodebuild..."
          set -o pipefail
          xcodebuild \
            -project Makinon.xcodeproj \
            -scheme Makinon \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Makinon.xcarchive \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SDKROOT=iphoneos \
            archive 2>&1 | tee build.log

      - name: Check Archive
        shell: bash
        run: |
          if [ -d "build/Makinon.xcarchive" ]; then
            echo "✅ Archive created: build/Makinon.xcarchive"
            ls -la build/Makinon.xcarchive || true
          else
            echo "❌ Archive missing — failing"
            tail -200 build.log || true
            exit 1
          fi

      - name: Export IPA with fastlane (no XML in workflow)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        shell: bash
        run: |
          echo "📦 Exporting IPA with fastlane gym (uses installed codesign assets)..."
          mkdir -p build/output

          # Use fastlane gym to export the IPA from the project/scheme — gym will handle exportOptions internally
          # fastlane gym options: --project, --scheme, --output_directory, --export_method
          fastlane gym \
            --project "Makinon.xcodeproj" \
            --scheme "Makinon" \
            --output_directory "build/output" \
            --export_method "development" \
            --clean || {
              echo "fastlane gym failed — printing build.log";
              tail -200 build.log || true;
              exit 1;
            }

          echo "✅ fastlane gym finished. IPA (if produced) will be in build/output"

      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: makinon-xcarchive
          path: build/Makinon.xcarchive
          if-no-files-found: warn

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: makinon-ipa
          path: build/output/*.ipa
          if-no-files-found: warn
