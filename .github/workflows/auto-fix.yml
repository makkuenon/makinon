name: Auto Fix + Commit + Xcode Build + IPA Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix_and_build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Project Structure
        shell: bash
        run: |
          echo "📁 Checking project structure..."
          echo "✓ project.yml exists:" && [ -f project.yml ] && echo "YES" || echo "NO"
          echo "✓ App directory:" && ls -la App/ | head -20
          echo "✓ Checking for storyboards..."
          find App -name "*.storyboard" -type f || true

      - name: Install XcodeGen
        shell: bash
        run: |
          echo "📦 Installing XcodeGen..."
          brew install xcodegen || true

      - name: Generate Xcode Project
        shell: bash
        run: |
          if [ -f project.yml ]; then
            echo "🔨 Generating Xcode project from project.yml..."
            xcodegen generate || true
            echo "✅ Xcode project generated"
          else
            echo "⚠️ project.yml not found — skipping xcodegen"
          fi
          ls -la *.xcodeproj || true

      - name: Setup Ruby & Fastlane
        shell: bash
        run: |
          echo "💎 Installing Ruby and fastlane..."
          brew install ruby || true
          gem install fastlane -NV || true
          fastlane --version || true

      - name: Build .app for packaging IPA (code signing disabled)
        shell: bash
        run: |
          echo "🔨 Building .app for packaging (code signing disabled)..."
          set -o pipefail
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export DEVELOPMENT_TEAM=""
          xcodebuild \
            -project Makinon.xcodeproj \
            -scheme Makinon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SDKROOT=iphoneos \
            clean build 2>&1 | tee build-app.log || true

      - name: Package unsigned IPA (no signing) from DerivedData
        shell: bash
        run: |
          echo "📦 Packaging unsigned IPA from built .app (no signing)..."
          set -e
          # Locate the .app inside the DerivedData build products
          APP_PATH=$(find build/DerivedData -path "*/Release-iphoneos/*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found in DerivedData, failing" && tail -200 build-app.log || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Prepare payload and copy the .app
          rm -rf build/output || true
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/

          # Remove any code signature artifacts to ensure it's unsigned
          rm -rf build/output/Payload/*.app/_CodeSignature || true
          rm -rf build/output/Payload/*.app/CodeResources || true

          # Create IPA by zipping the Payload folder
          pushd build/output >/dev/null
          zip -r ../makinon-unsigned.ipa Payload >/dev/null || true
          popd >/dev/null

          # Move IPA into output dir (zip produced one level up)
          mv build/makinon-unsigned.ipa build/output/ || true
          echo "📁 IPA files:"
          ls -la build/output || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: makinon-ipa
          path: build/output/*.ipa
          if-no-files-found: warn

      - name: Build archive with xcodebuild
        shell: bash
        run: |
          echo "🔨 Building archive with xcodebuild (code signing disabled)..."
          set -o pipefail
          # Disable code signing to avoid requiring certificates/provisioning profiles on the runner
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export DEVELOPMENT_TEAM=""
          xcodebuild \
            -project Makinon.xcodeproj \
            -scheme Makinon \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Makinon.xcarchive \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SDKROOT=iphoneos \
            archive 2>&1 | tee build.log

      - name: Check Archive
        shell: bash
        run: |
          if [ -d "build/Makinon.xcarchive" ]; then
            echo "✅ Archive created: build/Makinon.xcarchive"
            ls -la build/Makinon.xcarchive || true
          else
            echo "❌ Archive missing — failing"
            tail -200 build.log || true
            exit 1
          fi

